name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
    - uses: actions/setup-go@v4
      with:
        go-version: '1.26' # This should match .tool-versions
    - uses: pre-commit/action@v3.0.0
